[package]
name = "pragmatic-mt-eval"
version = "0.1.0"
edition = "2021"
description = "Pragmatic machine translation evaluation harness for Hebrew, Gujarati, and Vietnamese."
license = "MIT"
repository = "https://github.com/pragmatic-mt-eval/pragmatic-mt-eval"

[lib]
name = "pragmatic_mt_eval"
path = "src/lib.rs"

[[bin]]
name = "pragmatic-mt-eval"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1.11"
similar = "2.5"
aho-corasick = "1.1"
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
approx = "0.5"
